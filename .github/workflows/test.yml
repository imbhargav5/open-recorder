name: Tests

on:
  pull_request:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - '.github/workflows/**'
              - 'apps/macos/**'
              - 'apps/rust-service/**'
              - 'scripts/**'
              - 'Makefile'
              - 'package.json'

  native-tests:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Debug and release tests
        run: make test-macos test-macos-release
      - name: Script tests
        run: node --test scripts/*.test.mjs

  test:
    name: Native macOS tests
    needs: [changes, native-tests]
    if: always() && needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require both native architectures
        env:
          RESULT: ${{ needs.native-tests.result }}
        run: test "$RESULT" = success
